# Publishes the static overview page in site/ with GitHub Pages.
# One-time setup: Settings > Pages > Source = "GitHub Actions".
# Upload and deploy run in separate jobs, as GitHub recommends: the
# deploy job then only starts once the artifact is fully registered.
name: Publish overview page

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
